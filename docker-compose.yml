# =============================================================================
# FinTrack -- local stack: MySQL 8 plus the application.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up --build
#
# Every credential comes from .env, which is git-ignored. Nothing secret is
# written in this file, so it is safe to commit and safe to share.
# =============================================================================

services:

  mysql:
    image: mysql:8.0
    container_name: fintrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fintrack}
      MYSQL_USER: ${DB_USERNAME:-fintrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    ports:
      # Published on 3307 so the container does not fight a MySQL already
      # listening on the host's 3306. Inside the network the port is still 3306.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # The application must not start before the server accepts connections;
      # MySQL restarts itself once during first-run initialization, and a plain
      # "depends_on" would let Flyway attempt to migrate during that window.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Host is the service name, and the port is the container-internal 3306 --
      # not the published host port.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fintrack}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-fintrack}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8080
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  mysql-data:
    driver: local
