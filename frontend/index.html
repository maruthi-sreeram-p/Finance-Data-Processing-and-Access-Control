<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinTrack - track income, expenses and balances with role-based access control." />
    <meta name="color-scheme" content="light dark" />
    <title>FinTrack</title>
    <script>
      // Applies the stored theme before first paint. Deferring this to React would
      // show a flash of the wrong theme on every reload.
      (function () {
        try {
          var stored = localStorage.getItem('fintrack.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
