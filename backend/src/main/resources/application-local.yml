# ---------------------------------------------------------------------------
# Local development profile: the real application against an in-memory database.
#
#   ./mvnw spring-boot:run -Plocal -Dspring-boot.run.profiles=local
#
# This is the full backend -- the same security filter chain, the same Flyway
# migrations, the same authorization rules -- with H2 standing in for MySQL so a
# frontend developer can work without provisioning a database. It is NOT a mock:
# every response comes from the real service and repository layers.
#
# H2 runs in MySQL compatibility mode and executes the same migrations, so the
# schema is identical to the one MySQL gets. Use the `dev` profile for MySQL.
#
# Requires the `local` Maven profile, which is what puts H2 on the classpath.
# ---------------------------------------------------------------------------
spring:
  datasource:
    # File-backed rather than in-memory, so an account and its transactions survive
    # a restart. An in-memory database would wipe the ledger on every code change,
    # which makes anything multi-step -- registering, promoting, building up a
    # history to look at -- tedious to the point of being untestable.
    # The file lives under backend/data/ and is git-ignored.
    url: jdbc:h2:file:./data/fintrack-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

fintrack:
  jwt:
    # Development-only signing key, checked in on purpose so the profile starts
    # with no setup. It signs nothing of value: this profile keeps all its data in
    # memory and is discarded when the process stops. Real deployments supply
    # JWT_SECRET from the environment -- see .env.example.
    secret: bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1zaWduaW5nLWtleS1uZXZlci1kZXBsb3k=
    expiration-ms: 3600000
    issuer: fintrack-local

logging:
  level:
    com.fintrack: DEBUG

fintrack.local:
  # Promotes this account to ADMIN on startup, if it exists. Local profile only --
  # see LocalAdminBootstrap for why this exists and what stops it running elsewhere.
  # Register the account through the UI first, then restart to pick up the change.
  admin-email: ${LOCAL_ADMIN_EMAIL:admin@fintrack.test}
